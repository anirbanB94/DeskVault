name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\DeskVault.slnx

      - name: Test with coverage
        run: dotnet test .\DeskVault.slnx --no-restore --collect:"XPlat Code Coverage"

      - name: Generate coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@861674232075b2c6bd1405a04c4bb9b150653e81 # v5.5.12
        with:
          reports: "**/TestResults/**/coverage.cobertura.xml"
          targetdir: "${{ github.workspace }}/coverage-report"
          reporttypes: "Html;MarkdownSummaryGithub"

      - name: Add coverage summary
        shell: pwsh
        run: |
          Get-Content "${{ github.workspace }}/coverage-report/SummaryGithub.md" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-report
          path: "${{ github.workspace }}/coverage-report"
